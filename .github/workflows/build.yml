name: Watch Upstream Version

on:
 schedule:
    - cron: '0 0 * * *'
 workflow_dispatch:        # Allows running manually from GitHub UI

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants permission to commit the version file back to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Latest Upstream Version
        id: upstream
        run: |
          LATEST_TAG=$(curl -fsSL https://api.github.com/repos/brcly/linuwux-runtime/releases/latest | jq -r '.tag_name // empty')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "ERROR: Could not determine upstream version."
            echo "Stopping workflow."
            exit 1
          fi

          echo "Upstream version: '$LATEST_TAG'"

          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"
          echo "upstream_version=$LATEST_TAG" >> "$GITHUB_OUTPUT"
      - name: Compare with Saved Version
        id: compare
        run: |
          SAVED_TAG=""
          if [ -f ".upstream-version" ]; then
            SAVED_TAG=$(cat .upstream-version)
          fi

          echo "Saved version: '${SAVED_TAG}'"
          echo "Upstream version: '${LATEST_TAG}'"

          if [ "$SAVED_TAG" != "$LATEST_TAG" ]; then
            echo "CHANGED=true" >> $GITHUB_OUTPUT
          else
            echo "CHANGED=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Spec Version & Push
        if: steps.compare.outputs.CHANGED == 'true'
        run: |
          VERSION="${LATEST_TAG#v}"

          echo "Updating RPM Version to: $VERSION"

          sed -i -E "s/^Version:[[:space:]]+.*/Version: $VERSION/" *.spec

          echo "$LATEST_TAG" > .upstream-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .upstream-version *.spec
          git commit -m "chore: update upstream version to $LATEST_TAG"
          git push
